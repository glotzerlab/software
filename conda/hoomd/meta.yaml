{% set name = "hoomd" %}
{% set version = "7.1.2" %}
{% set build = 0 %}
{% set sha256 = "148892bed9f3aca8ec71d80023360b0ceab05a03b8d5d36c224a3315dd9e5ebb" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://github.com/glotzerlab/hoomd-blue/releases/download/v{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  binary_relocation: False
  script_env:
    - LD_LIBRARY_PATH
    - MPICC
    - CC
    - CXX
    - CPATH
    - CMAKE_PREFIX_PATH
    - CMAKE_LIBRARY_PATH
    - HIP_PLATFORM
    - HIP_COMPILER
    - HCC_AMDGPU_TARGET
    - SLURM_CPUS_PER_TASK
  number: {{ build }}
  string: {{ cluster }}_{{ device }}_py{{ py }}h{{ PKG_HASH }}_{{ build }}
  script: bash ${RECIPE_DIR}/build_hoomd.sh {{ device }} {{ gpu_platform }}

requirements:
  build:
    - cmake
    - ninja
    - pkg-config

  host:
    - cereal
    - eigen
    - numpy
    - pybind11 >=2.12.0
    - pybind11-abi
    - python

  run:
    - python
    - numpy
