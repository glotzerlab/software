{% set name = "hoomd" %}
{% set version = "4.8.0" %}
{% set build = 0 %}
{% set sha256 = "55749e234e94eddc3a52a0ddd75d69d0a8d5271a45b8814b9ee2c2b30b97d4fa" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://github.com/glotzerlab/hoomd-blue/releases/download/v{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  binary_relocation: False
  script_env:
    - LD_LIBRARY_PATH
    - MPICC
    - CC
    - CXX
    - CMAKE_PREFIX_PATH
    - HIP_PLATFORM
    - HIP_COMPILER
    - HCC_AMDGPU_TARGET
    - SLURM_CPUS_PER_TASK
  number: {{ build }}
  string: {{ cluster }}_{{ device }}_py{{ py }}h{{ PKG_HASH }}_{{ build }}
  script: bash ${RECIPE_DIR}/build_hoomd.sh {{ device }} {{ gpu_platform }}

requirements:
  build:
    - cmake
    - ninja
    - pkg-config

  host:
    - cereal
    - eigen
    - numpy
    - pybind11
    - pybind11-abi
    - python

  run:
    - python
    - numpy
