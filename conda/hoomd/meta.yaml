{% set name = "hoomd" %}
{% set version = "4.9.1" %}
{% set build = 0 %}
{% set sha256 = "b48ff3d44fef56ddf95c64b462b5d7f670bfc7a76b47223207edd3e7438e52bd" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://github.com/glotzerlab/hoomd-blue/releases/download/v{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  binary_relocation: False
  script_env:
    - LD_LIBRARY_PATH
    - MPICC
    - CC
    - CXX
    - CMAKE_PREFIX_PATH
    - HIP_PLATFORM
    - HIP_COMPILER
    - HCC_AMDGPU_TARGET
    - SLURM_CPUS_PER_TASK
  number: {{ build }}
  string: {{ cluster }}_{{ device }}_py{{ py }}h{{ PKG_HASH }}_{{ build }}
  script: bash ${RECIPE_DIR}/build_hoomd.sh {{ device }} {{ gpu_platform }}

requirements:
  build:
    - cmake
    - ninja
    - pkg-config

  host:
    - cereal
    - eigen
    - numpy
    - pybind11 >=2.12.0
    - pybind11-abi
    - python

  run:
    - python
    - numpy
