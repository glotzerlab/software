# Adapted from: https://github.com/conda-forge/mpi4py-feedstock/blob/main/recipe/meta.yaml

{% set version = "4.0.3" %}
{% set build = 0 %}

package:
  name: mpi4py
  version: {{ version }}

source:
  - fn: mpi4py-{{ version }}.tar.gz
    url: https://github.com/mpi4py/mpi4py/releases/download/{{ version }}/mpi4py-{{ version }}.tar.gz
    sha256: de2710d73e25e115865a3ab63d34a54b2d8608b724f761c567b6ad58dd475609

build:
  binary_relocation: False
  number: {{ build }}
  string: {{ cluster }}_py{{ py }}h{{ PKG_HASH }}_{{ build }}
  script_env:
    - LD_LIBRARY_PATH
    - MPICC
    - CC
    - CXX
    - CMAKE_PREFIX_PATH
  script:
    - {{ PYTHON }} -m pip install --no-deps . -vv
  run_exports:
    - {{ pin_subpackage("mpi4py", max_pin="x") }}

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools
    - python-build
    - cython
  run:
    - python
